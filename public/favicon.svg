<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Sleek rounded badge conforming to Geist design language -->
  <rect width="128" height="128" rx="28" fill="#171717"/>
  
  <!-- Dumbbell Icon angled diagonally -->
  <g transform="rotate(-45 64 64)" fill="#ffffff">
    <!-- Outer Left Plate -->
    <rect x="20" y="50" width="10" height="28" rx="4" />
    <!-- Inner Left Plate -->
    <rect x="32" y="44" width="10" height="40" rx="4" />
    
    <!-- Central Handle / Bar -->
    <rect x="42" y="59" width="44" height="10" rx="4" />
    
    <!-- Inner Right Plate -->
    <rect x="86" y="44" width="10" height="40" rx="4" />
    <!-- Outer Right Plate -->
    <rect x="98" y="50" width="10" height="28" rx="4" />
  </g>
</svg>
